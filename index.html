<!doctype html>
<html lang="de" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Milchtakt‑Rechner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="color-scheme" content="light dark">

  <style>
    html { scroll-behavior: smooth; }
    :focus-visible { outline: 2px solid #ef4444; outline-offset: 2px; }

    :root {
      --app-bg: #ffffff;
      --app-header-bg: #e1261c;
      --app-header-text: #ffffff;
      --app-font: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial;
    }

    .app-bg { background-color: var(--app-bg); }
    .app-font { font-family: var(--app-font); }
    .app-header-bg { background-color: var(--app-header-bg); }
    .app-header-text { color: var(--app-header-text); }
  </style>
</head>

<body class="h-full app-bg app-font text-gray-900 dark:text-gray-100">
  <div class="max-w-7xl mx-auto px-4 py-8">
    <header class="mb-6 app-header-bg app-header-text rounded-xl border border-gray-200 dark:border-gray-700">
      <div class="flex items-center gap-4 px-4 py-3">
        <img src="https://uploads-ssl.webflow.com/6305ec6e0c6973c351d2e8f0/632c7223dff9aca80faae0ea_Muller.svg" alt="Logo" class="h-12 w-auto rounded" />
        <h1 class="text-3xl font-semibold tracking-tight">
          SMK-Produktion Milchtakt‑Rechner
        </h1>
      </div>
    </header>

    <!-- Eingaben -->
    <section class="grid grid-cols-1 sm:grid-cols-4 gap-4 mb-6">
      <label class="block">
        <span class="block text-sm font-medium mb-1">Start (Datum &amp; Uhrzeit)</span>
        <input id="startDateTime" type="datetime-local"
          class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-rose-500 dark:bg-gray-800 dark:border-gray-700" />
        <small class="text-gray-500 dark:text-gray-400">aktuelle Zeit</small>
      </label>

      <label class="block">
        <span class="block text-sm font-medium mb-1">Ende (Datum &amp; Uhrzeit)</span>
        <input id="endDateTime" type="datetime-local"
          class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-rose-500 dark:bg-gray-800 dark:border-gray-700" />
        <small class="text-gray-500 dark:text-gray-400">leer lassen = manueller Takt</small>
      </label>

      <label class="block">
        <span class="block text-sm font-medium mb-1">Standard‑Takt (Minuten)</span>
        <input id="taktMinutes" type="number" step="0.1" min="0.1" value="80"
          class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-rose-500 dark:bg-gray-800 dark:border-gray-700" />
        <small id="taktNote" class="text-gray-500 dark:text-gray-400">Manuell (oder Ende setzen)</small>
      </label>

      <label class="block">
        <span class="block text-sm font-medium mb-1">Anzahl Schritte</span>
        <input id="stepCount" type="number" min="1" max="200" value="49"
          class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 shadow-sm focus:outline-none focus:ring-2 focus:ring-rose-500 dark:bg-gray-800 dark:border-gray-700" />
        <small class="text-gray-500 dark:text-gray-400">Standard ist 49.</small>
      </label>
    </section>

    <!-- Tabelle -->
    <div class="rounded-xl border border-gray-200 bg-white shadow dark:bg-gray-800 dark:border-gray-700">
      <div class="px-4 py-3 border-b border-gray-200 dark:border-gray-700 flex items-center justify-between">
        <h2 class="font-medium">Planübersicht</h2>
        <div class="flex items-center gap-2">
          <span id="statusBadge"
            class="text-xs px-2 py-1 rounded bg-emerald-100 text-emerald-700 dark:bg-emerald-900/40 dark:text-emerald-300">
            bereit
          </span>
          <button id="resetAllActualsBtn"
            class="text-xs px-2 py-1 rounded border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700"
            title="Alle 'Tatsächlich' leeren">
            Alle zurücksetzen
          </button>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead>
            <tr class="bg-gray-50 dark:bg-gray-900/40 text-gray-600 dark:text-gray-300">
              <th class="text-left px-4 py-2 font-medium">Charge</th>
              <th class="text-left px-4 py-2 font-medium">Zeitpunkt (geplant)</th>
              <th class="text-left px-4 py-2 font-medium">Takt bis hier (min)</th>
              <!-- ENTFERNT: Neuer Takt ab diesem Schritt -->
              <th class="text-left px-4 py-2 font-medium">Tatsächlich gezogen am</th>
              <th class="text-left px-4 py-2 font-medium">Verzug (h)</th>
            </tr>
          </thead>
          <tbody id="planBody" class="divide-y divide-gray-200 dark:divide-gray-700"></tbody>
        </table>
      </div>
    </div>

    <p class="mt-4 text-xs text-gray-500 dark:text-gray-400 mx-auto w-fit">
      ©2026 Danilo Unger | Schichtführer | SMK-Produktion
    </p>
  </div>

  <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 hidden"></div>

  <script>
    const fmt = new Intl.DateTimeFormat('de-DE', { dateStyle: 'medium', timeStyle: 'short' });
    const nf2 = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const DOC_ID = "milchtakt_state";

    const startInput = document.getElementById('startDateTime');
    const endInput = document.getElementById('endDateTime');
    const taktInput = document.getElementById('taktMinutes');
    const taktNote = document.getElementById('taktNote');
    const stepCountInput = document.getElementById('stepCount');
    const planBody = document.getElementById('planBody');
    const statusBadge = document.getElementById('statusBadge');
    const resetAllActualsBtn = document.getElementById('resetAllActualsBtn');

    // Overrides werden nicht mehr verwendet – Maps bleiben für Abwärtskompatibilität bestehen
    let overrides = new Map();
    let actuals = new Map(); // Map<number, 'YYYY-MM-DDTHH:mm'>

    function toDatetimeLocalValue(date) {
      const pad = (n) => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function parseDatetimeLocalValue(v) {
      if (!v || typeof v !== 'string' || !v.includes('T')) return null;
      const [datePart, timePart] = v.split('T');
      const [Y, M, D] = datePart.split('-').map(Number);
      const [h, m] = (timePart || '00:00').split(':').map(Number);
      if (![Y, M, D, h, m].every((x) => Number.isFinite(x))) return null;
      return new Date(Y, M - 1, D, h, m, 0, 0);
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 z-50 text-white text-sm px-4 py-2 rounded shadow bg-gray-700';
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 1400);
    }

    function getStartDate() { return parseDatetimeLocalValue(startInput.value); }
    function getEndDate() { return parseDatetimeLocalValue(endInput.value); }

    function getDefaultTakt() {
      const t = parseFloat(String(taktInput.value).replace(',', '.'));
      return isFinite(t) && t > 0 ? t : NaN;
    }

    function getStepCount() {
      const n = parseInt(stepCountInput.value, 10);
      return Number.isInteger(n) && n > 0 ? Math.min(n, 200) : 49;
    }

    
async function saveState() {
  const obj = {
    start: startInput.value || null,
    end: endInput.value || null,
    takt: getDefaultTakt() || 80,
    steps: getStepCount(),
    overrides: Array.from(overrides.entries()),
    actuals: Array.from(actuals.entries())
  };

  try {
    await window.fb.setDoc(
      window.fb.doc(window.db, "milchtakt", DOC_ID),
      obj
    );
  } catch (e) {
    console.error(e);
  }
}


async function loadState() {
  try {
    console.log("Lade aus Firestore...");

    const snap = await window.fb.getDoc(
      window.fb.doc(window.db, "milchtakt", DOC_ID)
    );

    console.log("Dokument existiert:", snap.exists());

    if (!snap.exists()) return false;

    const obj = snap.data();
    console.log(obj);

    if (obj.start) startInput.value = obj.start;
    if (obj.end) endInput.value = obj.end;
    if (obj.takt) taktInput.value = obj.takt;
    if (obj.steps) stepCountInput.value = obj.steps;

    overrides = new Map(obj.overrides || []);
    actuals = new Map(obj.actuals || []);

    return true;

  } catch (e) {
    console.error(e);
    return false;
  }
}

    function computeAutoTakt(start, end, steps) {
      if (!start || !end) return null;
      if (!Number.isInteger(steps) || steps < 2) return { error: 'Für Start/Ende-Modus sind mindestens 2 Schritte nötig.' };
      const ms = end.getTime() - start.getTime();
      if (ms <= 0) return { error: 'Ende muss nach Start liegen.' };
      return { takt: ms / ((steps - 1) * 60000) };
    }

    function computePlan() {
      const start = getStartDate();
      const end = getEndDate();
      const steps = getStepCount();

      if (!start) return { error: 'Bitte Startzeit angeben.' };

      const endMode = !!end;
      let effectiveTakt;

      if (endMode) {
        const a = computeAutoTakt(start, end, steps);
        if (a && a.error) return { error: a.error };
        effectiveTakt = a.takt;
      } else {
        const defTakt = getDefaultTakt();
        if (!isFinite(defTakt)) return { error: 'Bitte gültigen Takt angeben oder Ende setzen.' };
        effectiveTakt = defTakt;
      }

      const rows = [];
      let current = new Date(start.getTime());
      let currentTakt = effectiveTakt;

      for (let i = 1; i <= steps; i++) {
        if (i === 1) {
          rows.push({ index: i, time: new Date(current), usedTakt: null });
        } else {
          current = new Date(current.getTime() + currentTakt * 60000);
          rows.push({ index: i, time: new Date(current), usedTakt: currentTakt });
        }
        // Keine Overrides mehr
      }

      if (endMode && rows.length >= 2) {
        rows[rows.length - 1].time = new Date(end.getTime());
        rows[rows.length - 1].usedTakt = effectiveTakt;
      }

      return { rows, endMode, takt: effectiveTakt };
    }

    function render() {
      const start = getStartDate();
      const end = getEndDate();
      const steps = getStepCount();
      const endMode = !!end;

      // Takt-Feld & Hinweis
      if (endMode) {
        const a = computeAutoTakt(start, end, steps);
        if (a && a.error) {
          taktInput.disabled = true;
          taktNote.textContent = a.error;
          taktNote.className = "text-amber-600 dark:text-amber-400";
        } else {
          taktInput.disabled = true;
          taktInput.value = nf2.format(a.takt);
          taktNote.textContent = `Berechnet aus Start→Ende: ${nf2.format(a.takt)} min`;
          taktNote.className = "text-gray-500 dark:text-gray-400";
        }
      } else {
        taktInput.disabled = false;
        taktNote.textContent = 'Manuell (oder Ende setzen)';
        taktNote.className = "text-gray-500 dark:text-gray-400";
      }

      const res = computePlan();
      planBody.innerHTML = '';

      if (res.error) {
        statusBadge.textContent = 'Eingaben prüfen';
        statusBadge.className = 'text-xs px-2 py-1 rounded bg-amber-100 text-amber-700';
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 5; // ← angepasst: 5 Spalten gesamt nach Entfernen der Override-Spalte
        td.className = 'px-4 py-4 text-amber-700';
        td.textContent = res.error;
        tr.appendChild(td);
        planBody.appendChild(tr);
        return;
      }

      if (res.endMode) {
        statusBadge.textContent = `Ende gesetzt – Takt: ${nf2.format(res.takt)} min`;
        statusBadge.className = 'text-xs px-2 py-1 rounded bg-sky-100 text-sky-700';
      } else {
        statusBadge.textContent = 'aktualisiert';
        statusBadge.className = 'text-xs px-2 py-1 rounded bg-emerald-100 text-emerald-700';
      }

      for (const row of res.rows) {
        const tr = document.createElement('tr');

        // Charge
        const tdIdx = document.createElement('td');
        tdIdx.className = 'px-4 py-2 whitespace-nowrap';
        tdIdx.textContent = row.index;
        tr.appendChild(tdIdx);

        // Geplant – editierbar für 1 und letztes Element
        const tdTime = document.createElement('td');
        tdTime.className = 'px-4 py-2';

        const isFirst = row.index === 1;
        const isLast = row.index === res.rows.length;

        if (isFirst || isLast) {
          const timeInput = document.createElement('input');
          timeInput.type = 'datetime-local';
          timeInput.step = '60';
          timeInput.className = 'w-56 sm:w-64 rounded-lg border border-gray-300 bg-white px-2 py-1 shadow-sm dark:bg-gray-800 dark:border-gray-700';
          timeInput.value = toDatetimeLocalValue(row.time);

          timeInput.addEventListener('change', () => {
            const v = timeInput.value;
            const d = parseDatetimeLocalValue(v);

            if (!d) {
              if (isFirst) {
                startInput.value = '';
                showToast('Startzeit entfernt');
              } else if (isLast) {
                endInput.value = '';
                showToast('Ende entfernt (manueller Takt)');
              }
            } else {
              if (isFirst) {
                startInput.value = v;
                showToast('Startzeit aktualisiert');
              } else if (isLast) {
                endInput.value = v;
                showToast('Ende aktualisiert (Takt wird berechnet)');
              }
            }
            saveState();
            render();
          });

          tdTime.appendChild(timeInput);
        } else {
          tdTime.textContent = fmt.format(row.time);
        }
        tr.appendChild(tdTime);

        // Takt bis hier (min) – genau 2 Nachkommastellen
        const tdUsed = document.createElement('td');
        tdUsed.className = 'px-4 py-2';
        tdUsed.textContent = row.usedTakt == null ? '—' : nf2.format(row.usedTakt);
        tr.appendChild(tdUsed);

        // ENTFERNT: Neuer Takt ab diesem Schritt

        // Tatsächlich
        const tdActual = document.createElement('td');
        tdActual.className = 'px-4 py-2';
        const actualInput = document.createElement('input');
        actualInput.type = 'datetime-local';
        actualInput.step = '60';
        actualInput.className = 'w-56 sm:w-64 rounded-lg border border-gray-300 bg-white px-2 py-1 shadow-sm dark:bg-gray-800 dark:border-gray-700';
        const storedActual = actuals.get(row.index);
        if (storedActual) actualInput.value = storedActual;

        actualInput.addEventListener('change', () => {
          const v = actualInput.value;
          const d = parseDatetimeLocalValue(v);
          if (!d) {
            actuals.delete(row.index);
            actualInput.value = '';
            showToast(`Ist‑Zeit für Schritt ${row.index} entfernt`);
          } else {
            actuals.set(row.index, v);
            showToast(`Ist‑Zeit für Schritt ${row.index} gesetzt`);
          }
          saveState();
          render();
        });

        tdActual.appendChild(actualInput);
        tr.appendChild(tdActual);

        // Verzug (h)
        const tdDiff = document.createElement('td');
        tdDiff.className = 'px-4 py-2';
        const diffSpan = document.createElement('span');

        const actualVal = actuals.get(row.index);
        if (actualVal) {
          const actualDate = parseDatetimeLocalValue(actualVal);
          if (actualDate) {
            const diffHours = (actualDate.getTime() - row.time.getTime()) / 3600000;
            const sign = diffHours > 0 ? '+' : '';
            diffSpan.textContent = `${sign}${nf2.format(diffHours)}`;
            diffSpan.className = diffHours > 0
              ? 'font-medium text-rose-700 dark:text-rose-300'
              : 'font-medium text-emerald-700 dark:text-emerald-300';
          } else {
            diffSpan.textContent = '—';
            diffSpan.className = 'text-gray-500 dark:text-gray-400';
          }
        } else {
          diffSpan.textContent = '—';
          diffSpan.className = 'text-gray-500 dark:text-gray-400';
        }

        tdDiff.appendChild(diffSpan);
        tr.appendChild(tdDiff);

        planBody.appendChild(tr);
      }
    }

    // Events
    startInput.addEventListener('change', () => { saveState(); render(); });
    endInput.addEventListener('change',   () => { saveState(); render(); });
    taktInput.addEventListener('input',   () => { saveState(); render(); });
    stepCountInput.addEventListener('input', () => { saveState(); render(); });

    resetAllActualsBtn.addEventListener('click', () => {
      if (actuals.size === 0) {
        showToast('Keine Ist‑Zeiten gesetzt');
        return;
      }
      actuals.clear();
      saveState();
      render();
      showToast('Alle Ist‑Zeiten zurückgesetzt');
    });

    // Init
window.init = async function () {
  const now = new Date();
  now.setSeconds(0, 0);

  if (!startInput.value) {
    startInput.value = toDatetimeLocalValue(now);
  }

  await loadState();
  render();
}
  </script>
</body>

</script>
